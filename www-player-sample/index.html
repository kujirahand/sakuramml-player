<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>サクラMML サウンドプレイヤー</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e8edf7;
      background: #111827;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 14px;
      font-weight: 650;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      resize: vertical;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 14px;
      color: #eef2ff;
      background: #0b1020;
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #4b5563;
      border-radius: 8px;
      padding: 9px 16px;
      color: #f9fafb;
      background: #1f2937;
      cursor: pointer;
      font-weight: 600;
    }

    button.primary {
      border-color: #4f46e5;
      background: #4f46e5;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    input[type="range"] {
      flex: 1;
      min-width: 180px;
    }

    .status {
      margin-top: 12px;
      color: #a7f3d0;
      font-size: 0.92rem;
      min-height: 1.4em;
    }

    .log {
      margin-top: 8px;
      color: #9ca3af;
      white-space: pre-wrap;
      font-size: 0.85rem;
      min-height: 2.5em;
    }
  </style>
</head>

<body>
  <main>
    <h1>サクラMML サウンドプレイヤー</h1>
    <textarea id="mml">テンポ120
トラック1 音色(GrandPiano)
ドレミファソラシド</textarea>

    <div class="controls">
      <button id="play" class="primary">再生</button>
      <button id="pause">一時停止</button>
      <button id="stop">停止</button>
      <input id="seek" type="range" min="0" max="1" step="0.05" value="0" />
    </div>

    <div id="status" class="status">初期化中...</div>
    <div id="log" class="log"></div>
  </main>

  <script type="module">
    import { SakuraPlayer } from './sakura-mml-player.js';

    const mml = document.getElementById('mml');
    const playButton = document.getElementById('play');
    const pauseButton = document.getElementById('pause');
    const stopButton = document.getElementById('stop');
    const seek = document.getElementById('seek');
    const status = document.getElementById('status');
    const log = document.getElementById('log');

    const player = new SakuraPlayer();

    function setStatus(message) {
      status.textContent = message;
    }

    function formatTime(seconds) {
      const sec = Math.max(0, seconds || 0);
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    player.onEvent('compile', (event) => {
      log.textContent = event.detail.log || 'コンパイル成功';
    });

    player.onEvent('load', (event) => {
      seek.max = event.detail.duration;
      setStatus(`読み込み完了: ${formatTime(event.detail.duration)}`);
    });

    player.onEvent('position', (event) => {
      seek.value = event.detail.position;
      setStatus(`再生中: ${formatTime(event.detail.position)} / ${formatTime(event.detail.duration)}`);
    });

    player.onEvent('pause', (event) => {
      setStatus(`一時停止: ${formatTime(event.detail.position)}`);
    });

    player.onEvent('stop', () => {
      seek.value = 0;
      setStatus('停止しました');
    });

    player.onEvent('ended', () => {
      setStatus('再生が完了しました');
    });

    playButton.addEventListener('click', async () => {
      try {
        playButton.disabled = true;
        setStatus('準備中...');
        if (!player.soundFontLoaded) {
          await player.loadSoundFont();
        }
        await player.play(mml.value);
      } catch (error) {
        console.error(error);
        setStatus(`エラー: ${error.message || error}`);
      } finally {
        playButton.disabled = false;
      }
    });

    pauseButton.addEventListener('click', () => player.pause());
    stopButton.addEventListener('click', () => player.stop());
    seek.addEventListener('change', () => player.setPosistion(Number(seek.value)));

    await player.init();
    setStatus('MMLを入力して再生できます');
  </script>
</body>

</html>
